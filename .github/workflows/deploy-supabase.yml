name: Deploy Supabase backend

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DEVICE_SECRET_ENCRYPTION_KEY: ${{ secrets.DEVICE_SECRET_ENCRYPTION_KEY }}
      LOOKUP_RATE_LIMIT_SALT: ${{ secrets.LOOKUP_RATE_LIMIT_SALT }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment settings
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)
          test -n "$DEVICE_SECRET_ENCRYPTION_KEY" || (echo "Missing DEVICE_SECRET_ENCRYPTION_KEY secret" && exit 1)
          test -n "$LOOKUP_RATE_LIMIT_SALT" || (echo "Missing LOOKUP_RATE_LIMIT_SALT secret" && exit 1)

      - name: Link project and apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
                    DB_URL="$(python3 -c 'import os, urllib.parse; project=os.environ["SUPABASE_PROJECT_ID"]; password=urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""); print(f"postgresql://postgres.{project}:{password}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres")')"
          echo "::add-mask::$DB_URL"
          supabase db push --db-url "$DB_URL" --yes
          unset DB_URL

      - name: Set server-side encryption and rate-limit secrets
        run: |
          set -euo pipefail
          secret_file="supabase/.env.production"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'DEVICE_SECRET_ENCRYPTION_KEY=%s\nLOOKUP_RATE_LIMIT_SALT=%s\n' "$DEVICE_SECRET_ENCRYPTION_KEY" "$LOOKUP_RATE_LIMIT_SALT" > "$secret_file"
          supabase secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
